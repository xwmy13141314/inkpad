<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 300px; overflow: hidden; }

  body {
    background: #fff;
    color: #000;
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    -webkit-font-smoothing: antialiased;
    padding: 15px 22px 13px 20px;
    display: flex;
    flex-direction: column;
  }

  /* ── 顶部：日期 + 天气 ───────────────────── */
  .head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 9px;
    border-bottom: 1px solid #000;
  }

  .date-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .day { font-size: 42px; font-weight: 800; line-height: 1; letter-spacing: -1px; color: #d02020; }
  .weekday { font-size: 16px; letter-spacing: 1px; }
  .weekend { color: #d02020; }

  .lunar { font-size: 13px; letter-spacing: 1px; margin-top: 5px; }

  .weather { text-align: right; }
  .temp { font-size: 38px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .temp .unit { font-size: 20px; font-weight: 500; }
  .cond { font-size: 13px; letter-spacing: 1px; margin-top: 5px; }
  .range { font-size: 12px; letter-spacing: 0.5px; margin-top: 2px; }

  /* ── 中部：待办 ─────────────────────────── */
  .todos {
    flex: 1;
    padding: 10px 0 6px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow: hidden;
  }

  .todo {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 15px;
    line-height: 1.35;
    letter-spacing: 0.5px;
  }

  .box {
    flex: 0 0 auto;
    width: 11px;
    height: 11px;
    border: 1.5px solid #000;
    margin-top: 4px;
  }

  .todo.done .box { background: #000; }
  .todo.done .txt { text-decoration: line-through; }
  .todo .txt { flex: 1; }

  /* ── 底部：年度进度 ─────────────────────── */
  .foot { padding-top: 8px; border-top: 1px solid #000; }

  .bar-row { display: flex; align-items: center; gap: 8px; }

  .track {
    flex: 1;
    height: 9px;
    border: 1px solid #000;
    padding: 1px;
  }

  .fill { height: 100%; background: #d02020; }

  .pct { font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
  .label { font-size: 12px; letter-spacing: 1px; margin-bottom: 5px; }
</style>
</head>
<body>
  <div class="head">
    <div>
      <div class="date-line">
        <span class="day">{{day}}</span>
        <span class="weekday {{weekdayClass}}">{{weekday}}</span>
      </div>
      <div class="lunar">{{lunar}}</div>
    </div>
    <div class="weather">
      <div class="temp">{{temp}}<span class="unit">°</span></div>
      <div class="cond">{{cond}}</div>
      <div class="range">{{range}}</div>
    </div>
  </div>

  <div class="todos">{{todos}}</div>

  <div class="foot">
    <div class="label">{{progressLabel}}</div>
    <div class="bar-row">
      <div class="track"><div class="fill" style="width:{{progress}}%"></div></div>
      <div class="pct">{{progress}}%</div>
    </div>
  </div>
</body>
</html>
