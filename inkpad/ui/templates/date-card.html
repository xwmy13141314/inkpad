<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 400×300 三色屏。右边缘约 16~18px 会被边框遮挡，所以右边留 22px。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 400px;
    height: 300px;
    overflow: hidden;
  }

  body {
    background: #ffffff;
    color: #000000;
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    /* 灰度抗锯齿，避免次像素渲染产生彩色边，量化后会变脏 */
    -webkit-font-smoothing: antialiased;
    padding: 16px 22px 14px 20px;
    display: flex;
    flex-direction: column;
  }

  /* ── 顶部信息行 ───────────────────────────── */
  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    letter-spacing: 2px;
    line-height: 1.2;
    padding-bottom: 6px;
    border-bottom: 1px solid #000;
  }

  .head .ganzhi {
    font-size: 13px;
    letter-spacing: 1px;
  }

  /* ── 主体：大数字 + 右侧信息 ───────────────── */
  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 0;
    min-height: 0;
  }

  .day {
    font-size: 150px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -5px;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }

  .meta {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
  }

  .weekday {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 2px;
  }

  .weekend { color: #d02020; }

  .lunar {
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 1px;
    margin-top: 6px;
  }

  .jieqi {
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* 没有节气/节日时整块不占位 */
  .jieqi:empty { display: none; }

  /* ── 底部 ─────────────────────────────────── */
  .foot {
    border-top: 2px solid #d02020;
    padding-top: 8px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .footer {
    font-size: 15px;
    line-height: 1.3;
    letter-spacing: 1px;
  }

  .week {
    font-size: 12px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="ym">{{year}} · {{month}}</div>
    <div class="ganzhi">{{ganzhi}}</div>
  </div>

  <div class="main">
    <div class="day">{{day}}</div>
    <div class="meta">
      <div class="weekday {{weekdayClass}}">{{weekday}}</div>
      <div class="lunar">{{lunar}}</div>
      <div class="jieqi">{{jieqi}}</div>
    </div>
  </div>

  <div class="foot">
    <div class="footer">{{footer}}</div>
    <div class="week">{{week}}</div>
  </div>
</body>
</html>
