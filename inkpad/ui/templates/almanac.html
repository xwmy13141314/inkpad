<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 300px; overflow: hidden; }

  body {
    background: #fff;
    color: #000;
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    -webkit-font-smoothing: antialiased;
    padding: 18px 24px 14px;
    display: flex;
    flex-direction: column;
  }

  /* 顶部：左农历大字，右公历+星期 */
  .head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 10px;
    border-bottom: 2px solid #000;
  }
  .lunar-day {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 4px;
    line-height: 1;
  }
  .lunar-day .m { font-size: 22px; font-weight: 700; }
  .solar { text-align: right; font-size: 14px; line-height: 1.5; }
  .solar .md { font-size: 17px; font-weight: 700; }
  .solar .we.weekend { color: #d02020; }

  /* 中部：宜忌两栏，传统黄历竖列 */
  .mid {
    flex: 1;
    display: flex;
    align-items: stretch;
    padding: 8px 6px;
  }
  .col {
    flex: 1;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .col.ji { border-left: 1px solid #000; }
  .badge {
    align-self: center;
    width: 34px; height: 34px;
    border: 2.5px solid #000;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800;
  }
  .col.ji .badge { border-color: #d02020; color: #d02020; }
  .words {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    font-size: 16px;
    letter-spacing: 3px;
    text-align: center;
  }
  .col.ji .words { color: #d02020; }

  /* 底栏 */
  .foot {
    border-top: 1px dashed #000;
    padding-top: 7px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .jieqi { color: #d02020; font-weight: 700; }
</style>
</head>
<body>
  <div class="head">
    <div class="lunar-day"><span class="m">{{lunarMonth}}</span>{{lunarDay}}</div>
    <div class="solar">
      <div class="md">{{solarDate}}</div>
      <div class="we {{weekendClass}}">{{weekday}} · {{ganzhi}}</div>
    </div>
  </div>
  <div class="mid">
    <div class="col yi">
      <div class="badge">宜</div>
      <div class="words">{{yi}}</div>
    </div>
    <div class="col ji">
      <div class="badge">忌</div>
      <div class="words">{{ji}}</div>
    </div>
  </div>
  <div class="foot">
    <div>{{zodiac}}</div>
    <div class="jieqi">{{jieqi}}</div>
  </div>
</body>
</html>
