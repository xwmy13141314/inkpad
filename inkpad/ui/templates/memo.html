<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 300px; overflow: hidden; }

  body {
    background: #fff;
    color: #000;
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    -webkit-font-smoothing: antialiased;
    padding: 18px 22px 14px 20px;
    display: flex;
    flex-direction: column;
  }

  .head { display: flex; align-items: baseline; gap: 9px; }

  /* 便签头：左上角红色小方块 */
  .tag { width: 9px; height: 9px; background: #d02020; flex: 0 0 auto; }

  .title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1.1;
  }

  .date { margin-left: auto; font-size: 13px; letter-spacing: 1px; color: #d02020; }

  .rule { height: 1px; background: #000; margin: 9px 0 10px; }

  .body {
    flex: 1;
    font-size: {{fontSize}}px;
    line-height: 1.62;
    letter-spacing: 0.5px;
    white-space: pre-wrap;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="tag"></div>
    <div class="title">{{title}}</div>
    <div class="date">{{date}}</div>
  </div>
  <div class="rule"></div>
  <div class="body">{{body}}</div>
</body>
</html>
