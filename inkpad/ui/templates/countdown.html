<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 300px; overflow: hidden; }

  body {
    background: #fff;
    color: #000;
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    -webkit-font-smoothing: antialiased;
    padding: 20px 22px 16px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .name {
    font-size: 20px;
    letter-spacing: 4px;
    padding-bottom: 8px;
    border-bottom: 2px solid #d02020;
    align-self: stretch;
    text-align: center;
  }

  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .days {
    font-size: 132px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -6px;
    color: #d02020;
    font-variant-numeric: tabular-nums;
  }

  .unit {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 2px;
    align-self: flex-end;
    padding-bottom: 22px;
  }

  .foot {
    align-self: stretch;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: 1px dashed #000;
    padding-top: 6px;
    font-size: 12px;
    letter-spacing: 1px;
  }

  .others { font-size: 12px; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="name">{{name}}</div>

  <div class="main">
    <div class="days">{{days}}</div>
    <div class="unit">天</div>
  </div>

  <div class="foot">
    <div>{{date}}</div>
    <div class="others">{{others}}</div>
  </div>
</body>
</html>
