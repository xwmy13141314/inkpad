<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 300px; overflow: hidden; }

  body {
    background: #fff;
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    position: relative;
  }

  /* 照片铺满，cover 裁切。缩放交给浏览器，抖动交给量化。 */
  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 底部说明条：只有填了 caption 才显示 */
  .bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: #ffffff;
    border-top: 2px solid #d02020;
    padding: 7px 22px 7px 20px;
    font-size: 13px;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .bar:empty, .bar.hide { display: none; }

  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    letter-spacing: 2px;
    color: #000;
  }
</style>
</head>
<body>
  {{content}}
</body>
</html>
