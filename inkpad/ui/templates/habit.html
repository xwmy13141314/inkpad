<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 300px; overflow: hidden; }
  body {
    background: #fff; color: #000;
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    -webkit-font-smoothing: antialiased;
    padding: 16px 22px 14px 20px;
    display: flex; flex-direction: column;
  }
  .head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 8px; border-bottom: 1px solid #000;
  }
  .title { font-size: 20px; font-weight: 700; letter-spacing: 3px; }
  .meta { font-size: 12px; letter-spacing: 1px; }
  .rows { flex: 1; display: flex; flex-direction: column; gap: 7px; padding-top: 10px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 8px; }
  .name { flex: 0 0 64px; font-size: 13px; letter-spacing: 0.5px; }
  .cells { flex: 1; display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; }
  .c { aspect-ratio: 1; border: 1px solid #000; }
  .c.on { background: #d02020; border-color: #d02020; }
  .c.half { background: linear-gradient(to top, #d02020 50%, #fff 50%); border-color: #d02020; }
  .rate { flex: 0 0 38px; text-align: right; font-size: 12px; }
  .foot {
    border-top: 1px dashed #000; padding-top: 7px;
    display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 1px;
  }
  .red { color: #d02020; font-weight: 700; }
</style>
</head>
<body>
  <div class="head">
    <div class="title">{{title}}</div>
    <div class="meta">{{meta}}</div>
  </div>
  <div class="rows">{{rows}}</div>
  <div class="foot">
    <div>{{left}}</div>
    <div class="red">{{right}}</div>
  </div>
</body>
</html>
