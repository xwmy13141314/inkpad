<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 300px; overflow: hidden; }

  body {
    background: #fff;
    color: #000;
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    -webkit-font-smoothing: antialiased;
    padding: 20px 24px 14px;
    display: flex;
    flex-direction: column;
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 2px solid #000;
  }
  .tag {
    padding: 3px 10px;
    border: 1.5px solid #d02020;
    border-radius: 4px;
    color: #d02020;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .date { font-size: 13px; letter-spacing: 1px; }

  .title {
    margin: 14px 0 10px;
    text-align: center;
    font-weight: 800;
    letter-spacing: 2px;
    line-height: 1.4;
    white-space: nowrap;
  }

  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    text-align: center;
  }
  .body .ln { display: block; letter-spacing: 1px; }

  .foot {
    border-top: 1px dashed #000;
    padding-top: 7px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .foot .ai { color: #d02020; }

  .empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="tag">{{tag}}</div>
    <div class="date">{{date}}</div>
  </div>
  {{content}}
</body>
</html>
