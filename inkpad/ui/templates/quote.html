<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 300px; overflow: hidden; }

  body {
    background: #fff;
    color: #000;
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    -webkit-font-smoothing: antialiased;
    padding: 26px 26px 18px 24px;
    display: flex;
    flex-direction: column;
  }

  /* 左上角引号：红色，占位小，起强调作用 */
  .quote-mark {
    color: #d02020;
    font-size: 44px;
    line-height: 0.7;
    font-weight: 700;
    font-family: Georgia, serif;
    height: 30px;
  }

  .text {
    flex: 1;
    font-size: {{fontSize}}px;
    line-height: 1.55;
    letter-spacing: 1px;
    font-weight: 500;
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  .text span { display: block; width: 100%; }

  .source {
    text-align: right;
    font-size: 14px;
    letter-spacing: 1px;
    margin-top: 4px;
    color: #d02020;
  }

  .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: 1px dashed #000;
    padding-top: 6px;
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="quote-mark">&ldquo;</div>
  <div class="text"><span>{{text}}</span></div>
  <div class="source">{{source}}</div>
  <div class="foot">
    <div>{{date}}</div>
    <div>{{index}}</div>
  </div>
</body>
</html>
