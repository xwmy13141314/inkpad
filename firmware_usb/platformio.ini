; 墨签 InkPad · 4.2 寸三色墨水屏固件（USB 主通路 + WiFi 副通路）
;
; 平台锁定说明：
;   必须锁 espressif32@6.12.0（对应 Arduino core 2.0.17）。
;   浮动版本会解析到 8.x（core 3.x），WiFi/WebSockets 头文件编译不过。
;   工具链不显式 pin：mac(arm64) 需要 11.2.0 原生版，Windows 用默认 x86_64 即可。
;
; Flash 说明：
;   板载 ESMT Flash 跑不了 80MHz，必须 40MHz + dio，否则 bootloader 提速后
;   读分区表全 0xFF，设备无限重启。

[env:esp32c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

; ⚠ 临时：本机直连 GitHub 只有 30KB/s，走 ghfast 加速通道把包装下来。
;   装好之后这三行可以删掉，PlatformIO 会复用 ~/.platformio/packages 里已装的版本。
platform_packages =
    platformio/framework-arduinoespressif32 @ https://ghfast.top/https://github.com/ivankravets/pioreg-ci-mirror/releases/download/framework-arduinoespressif32/ccc7a67-framework-arduinoespressif32-3.20017.0.tar.gz
    espressif/toolchain-riscv32-esp @ https://ghfast.top/https://github.com/ivankravets/pioreg-ci-mirror/releases/download/toolchain-riscv32-esp-windows_amd64/7eebbb1-toolchain-riscv32-esp-windows_amd64-8.4.0+2021r2-patch5.tar.gz
    platformio/tool-esptoolpy @ https://ghfast.top/https://github.com/ivankravets/pioreg-ci-mirror/releases/download/tool-esptoolpy/f3e6ab0-tool-esptoolpy-2.40900.0.tar.gz

board_build.f_flash = 40000000L
board_build.flash_mode = dio

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
    ; M6 打开 WiFi 副通路时，取消下一行注释
    ; -DENABLE_WIFI=1

; 启用 WiFi 副通路的编译环境（M6）
; 固件会多带 WiFi + mDNS + HTTP server，体积从 274KB 涨到约 1.1MB
[env:esp32c3-wifi]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

board_build.f_flash = 40000000L
board_build.flash_mode = dio

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DENABLE_WIFI=1
    -O2

platform_packages =
    platformio/framework-arduinoespressif32 @ https://ghfast.top/https://github.com/ivankravets/pioreg-ci-mirror/releases/download/framework-arduinoespressif32/ccc7a67-framework-arduinoespressif32-3.20017.0.tar.gz
    espressif/toolchain-riscv32-esp @ https://ghfast.top/https://github.com/ivankravets/pioreg-ci-mirror/releases/download/toolchain-riscv32-esp-windows_amd64/7eebbb1-toolchain-riscv32-esp-windows_amd64-8.4.0+2021r2-patch5.tar.gz
    platformio/tool-esptoolpy @ https://ghfast.top/https://github.com/ivankravets/pioreg-ci-mirror/releases/download/tool-esptoolpy/f3e6ab0-tool-esptoolpy-2.40900.0.tar.gz
